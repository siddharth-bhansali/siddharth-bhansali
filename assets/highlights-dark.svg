<svg xmlns="http://www.w3.org/2000/svg" width="940" height="294" viewBox="0 0 940 294">
  <foreignObject x="0" y="0" width="940" height="282">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
    .root { box-sizing: border-box; width: 940px; background: #2A2D35; border-radius: 24px;
            font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E2E8F0; padding: 30px; }
    .raised { background: #2A2D35; box-shadow: 6px 6px 14px #1E2027, -6px -6px 14px #33363F; }
    .raised-sm { background: #2A2D35; box-shadow: 3px 3px 8px #1E2027, -3px -3px 8px #33363F; }
    .inset { background: #2A2D35; box-shadow: inset 3px 3px 8px #1E2027, inset -3px -3px 8px #33363F; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700;
             margin: 0 0 22px 4px; }
    .title::before { content: ''; width: 6px; height: 20px; border-radius: 9999px; background: #8B85FF; }
    .fade { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .card { border-radius: 16px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 6px;
            height: 162px; box-sizing: border-box; }
    .value { font-size: 32px; font-weight: 800; color: #8B85FF; letter-spacing: -0.5px; }
    .label { font-size: 13px; line-height: 1.4; font-weight: 500; }
    .foot { flex: none; margin-top: auto; position: relative; height: 26px; border-radius: 9999px; overflow: hidden;
            display: flex; align-items: center; padding: 0 12px; font-size: 11px; font-weight: 600; color: #9BA5B8; }
    .foot .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9999px; background: #8B85FF;
                  opacity: .22; transform-origin: left; animation: grow 1.4s .6s ease-out both; }
    .foot span { position: relative; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
     .root { height: 282px; box-sizing: border-box; }</style>
      <div class="root"><div class="title">Highlights at One</div><div class="cards"><div class="card raised fade" style="animation-delay:0.0s"><div class="value">45%</div><div class="label">of One's integrations built or rebuilt by me</div><div class="foot inset"><div class="fill" style="width:45%"></div><span>and counting</span></div></div><div class="card raised fade" style="animation-delay:0.1s"><div class="value">70%</div><div class="label">smaller AI-agent knowledge payloads</div><div class="foot inset"><div class="fill" style="width:70%"></div><span>958k → 291k characters</span></div></div><div class="card raised fade" style="animation-delay:0.2s"><div class="value">1,000+</div><div class="label">pull requests</div><div class="foot inset"><span>across 30+ repos</span></div></div><div class="card raised fade" style="animation-delay:0.3s"><div class="value">3,000+</div><div class="label">commits</div><div class="foot inset"><span>since Dec 2023</span></div></div></div></div>
    </div>
  </foreignObject>
</svg>
