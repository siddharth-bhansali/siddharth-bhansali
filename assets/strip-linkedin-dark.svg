<svg xmlns="http://www.w3.org/2000/svg" width="148" height="84" viewBox="0 0 148 84">
  <foreignObject x="0" y="0" width="148" height="84">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
    .root { box-sizing: border-box; width: 940px; background: #2A2D35; border-radius: 24px;
            font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E2E8F0; padding: 30px; }
    .raised { background: #2A2D35; box-shadow: 6px 6px 14px #1E2027, -6px -6px 14px #33363F; }
    .raised-sm { background: #2A2D35; box-shadow: 3px 3px 8px #1E2027, -3px -3px 8px #33363F; }
    .inset { background: #2A2D35; box-shadow: inset 3px 3px 8px #1E2027, inset -3px -3px 8px #33363F; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700;
             margin: 0 0 22px 4px; }
    .title::before { content: ''; width: 6px; height: 20px; border-radius: 9999px; background: #8B85FF; }
    .fade { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    .plate { box-sizing: border-box; height: 84px; background: #2A2D35; border-radius: 24px 0 0 24px; padding: 18px 10px 18px 26px;
             font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E2E8F0; }
    .btn { height: 48px; border-radius: 9999px; display: flex; align-items: center; justify-content: center;
           gap: 10px; font-size: 14px; font-weight: 700; }
    .btn img { width: 18px; height: 18px; }
     .root { height: 84px; box-sizing: border-box; }</style>
      <div class="plate"><div class="btn raised-sm"><img src="data:image/svg+xml;base64,"/>LinkedIn</div></div>
    </div>
  </foreignObject>
</svg>
