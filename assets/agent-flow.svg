<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .label { font-size: 13px; font-weight: 600; fill: #e8ecff; }
      .small { font-size: 10.5px; fill: #9aa4c7; }
      .hubtxt { font-size: 15px; font-weight: 700; fill: #0b1020; }
      .wire { fill: none; stroke: #3b4a7a; stroke-width: 1.6; stroke-dasharray: 3 6; animation: flow 1.4s linear infinite; }
      .pill { fill: #161d38; stroke: #2a3561; }
      .lit { animation: lit 4s ease-in-out infinite; }
      .ring { fill: none; stroke: #ffb347; transform-origin: 180px 170px; animation: ring 2.4s ease-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      @keyframes lit { 0%,70%,100% { stroke: #2a3561; } 80% { stroke: #ffb347; } }
      @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
    </style>
  </defs>

  <rect width="400" height="340" rx="16" fill="#0b1020"/>

  <!-- agent -->
  <rect x="10" y="146" width="92" height="48" rx="12" fill="#161d38" stroke="#9aa4c7"/>
  <text x="56" y="168" text-anchor="middle" class="label">AI agent</text>
  <text x="56" y="184" text-anchor="middle" class="small">&#8220;send invoice&#8221;</text>
  <path class="wire" d="M102 170 L155 170"/>

  <!-- hub -->
  <circle class="ring" cx="180" cy="170" r="24"/>
  <circle cx="180" cy="170" r="26" fill="url(#accent)"/>
  <text x="180" y="175" text-anchor="middle" class="hubtxt">One</text>

  <!-- wires to platforms -->
  <path class="wire" d="M206 170 C240 170 240 30 268 30"/>
  <path class="wire" d="M206 170 C240 170 240 70 268 70"/>
  <path class="wire" d="M206 170 C240 170 240 110 268 110"/>
  <path class="wire" d="M206 170 C240 170 240 150 268 150"/>
  <path class="wire" d="M206 170 C240 170 240 190 268 190"/>
  <path class="wire" d="M206 170 C240 170 240 230 268 230"/>
  <path class="wire" d="M206 170 C240 170 240 270 268 270"/>
  <path class="wire" d="M206 170 C240 170 240 310 268 310"/>

  <!-- platforms (7 named + 930 = 937 live) -->
  <g>
    <rect class="pill lit" style="animation-delay:0s"   x="268" y="16"  width="116" height="28" rx="14"/><text x="326" y="34"  text-anchor="middle" class="label">Gmail</text>
    <rect class="pill lit" style="animation-delay:.5s"  x="268" y="56"  width="116" height="28" rx="14"/><text x="326" y="74"  text-anchor="middle" class="label">Stripe</text>
    <rect class="pill lit" style="animation-delay:1s"   x="268" y="96"  width="116" height="28" rx="14"/><text x="326" y="114" text-anchor="middle" class="label">Slack</text>
    <rect class="pill lit" style="animation-delay:1.5s" x="268" y="136" width="116" height="28" rx="14"/><text x="326" y="154" text-anchor="middle" class="label">Jira</text>
    <rect class="pill lit" style="animation-delay:2s"   x="268" y="176" width="116" height="28" rx="14"/><text x="326" y="194" text-anchor="middle" class="label">Notion</text>
    <rect class="pill lit" style="animation-delay:2.5s" x="268" y="216" width="116" height="28" rx="14"/><text x="326" y="234" text-anchor="middle" class="label">HubSpot</text>
    <rect class="pill lit" style="animation-delay:3s"   x="268" y="256" width="116" height="28" rx="14"/><text x="326" y="274" text-anchor="middle" class="label">GitHub</text>
    <rect class="pill" x="268" y="296" width="116" height="28" rx="14" stroke-dasharray="4 3"/><text x="326" y="314" text-anchor="middle" class="small">+930 more</text>
  </g>
</svg>
