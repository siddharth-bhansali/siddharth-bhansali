s="val">574</div><div class="track inset"><div class="bar" style="height:99px;animation-delay:0.65s"></div></div><div class="mon">Jun</div></div><div class="col"><div class="val">394</div><div class="track inset"><div class="bar" style="height:68px;animation-delay:0.70s"></div></div><div class="mon">Jul</div></div><div class="col"><div class="val strong">695</div><div class="track inset"><div class="bar" style="height:120px;animation-delay:0.75s"></div></div><div class="mon">Aug</div></div><div class="col"><div class="val">688</div><div class="track inset"><div class="bar" style="height:119px;animation-delay:0.80s"></div></div><div class="mon">Sep</div></div><div class="col"><div class="val strong">166*</div><div class="track inset"><div class="bar cur" style="height:29px;animation-delay:0.85s"></div></div><div class="mon">Oct</div></div></div><div class="note">* October so far</div></div><div class="panel raised fade" style="animation-delay:.4s"><div class="ptitle">Work mix</div><div class="mix inset"><div class="seg" style="flex:2262;background:#22a877"></div><div class="seg" style="flex:1352;background:#7A73F0"></div><div class="seg" style="flex:632;background:#e0703f"></div></div><div class="legend"><div class="item"><i style="background:#22a877"></i><b>53%</b><span>Commits · 2,262</span></div><div class="item"><i style="background:#7A73F0"></i><b>32%</b><span>Code reviews · 1,352</span></div><div class="item"><i style="background:#e0703f"></i><b>15%</b><span>Pull requests · 632</span></div></div></div></div></div>
