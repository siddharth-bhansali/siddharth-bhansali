<svg xmlns="http://www.w3.org/2000/svg" width="940" height="544" viewBox="0 0 940 544">
  <foreignObject x="0" y="0" width="940" height="532">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
    .root { box-sizing: border-box; width: 940px; background: #2A2D35; border-radius: 24px;
            font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E2E8F0; padding: 30px; }
    .raised { background: #2A2D35; box-shadow: 6px 6px 14px #1E2027, -6px -6px 14px #33363F; }
    .raised-sm { background: #2A2D35; box-shadow: 3px 3px 8px #1E2027, -3px -3px 8px #33363F; }
    .inset { background: #2A2D35; box-shadow: inset 3px 3px 8px #1E2027, inset -3px -3px 8px #33363F; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700;
             margin: 0 0 22px 4px; }
    .title::before { content: ''; width: 6px; height: 20px; border-radius: 9999px; background: #8B85FF; }
    .fade { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { border-radius: 16px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 6px;
            height: 150px; box-sizing: border-box; }
    .value { font-size: 32px; font-weight: 800; color: #8B85FF; letter-spacing: -0.5px; }
    .label { font-size: 13px; font-weight: 500; }
    .foot { flex: none; margin-top: auto; height: 26px; border-radius: 9999px; display: flex; align-items: center;
            padding: 0 12px; font-size: 11px; font-weight: 600; color: #9BA5B8; }
    .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 22px; }
    .panel { border-radius: 16px; padding: 20px 22px; box-sizing: border-box; }
    .ptitle { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
    
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 164px; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
    .track { width: 22px; height: 120px; border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
    .bar { width: 100%; background: #8B85FF; border-radius: 4px 4px 0 0; opacity: .55;
           transform-origin: bottom; animation: up .9s ease-out both; }
    .bar.cur { opacity: 1; }
    .mon { font-size: 10px; font-weight: 600; color: #9BA5B8; }
    .val { position: absolute; top: -18px; font-size: 10px; font-weight: 600; white-space: nowrap; color: #9BA5B8; }
    .val.strong { font-size: 11px; font-weight: 800; color: #E2E8F0; }
    .note { font-size: 10px; color: #9BA5B8; margin-top: 8px; }
    @keyframes up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .mix { display: flex; gap: 2px; height: 22px; border-radius: 9999px; overflow: hidden; padding: 4px; }
    .seg { height: 100%; transform-origin: left; animation: grow 1s .4s ease-out both; }
    .seg:first-child { border-radius: 9999px 0 0 9999px; }
    .seg:last-child { border-radius: 0 9999px 9999px 0; }
    .legend { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; font-size: 12px; }
    .item { display: flex; align-items: center; gap: 8px; }
    .item i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .item b { font-size: 14px; font-weight: 800; }
    .item span { color: #9BA5B8; font-weight: 500; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
     .root { height: 532px; box-sizing: border-box; }</style>
