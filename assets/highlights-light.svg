<svg xmlns="http://www.w3.org/2000/svg" width="940" height="392" viewBox="0 0 940 392">
  <foreignObject x="0" y="0" width="940" height="392">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
    .root { box-sizing: border-box; width: 940px; background: #E4E9F0; border-radius: 24px;
            font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; color: #2D3748; padding: 30px; }
    .raised { background: #E4E9F0; box-shadow: 6px 6px 14px #B8C0CC, -6px -6px 14px #FFFFFF; }
    .raised-sm { background: #E4E9F0; box-shadow: 3px 3px 8px #B8C0CC, -3px -3px 8px #FFFFFF; }
    .inset { background: #E4E9F0; box-shadow: inset 3px 3px 8px #B8C0CC, inset -3px -3px 8px #FFFFFF; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700;
             margin: 0 0 22px 4px; }
    .title::before { content: ''; width: 6px; height: 20px; border-radius: 9999px; background: #5B54E0; }
    .fade { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 20px; }
    .card { border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; height: 132px; box-sizing: border-box; }
    .value { font-size: 32px; font-weight: 800; color: #5B54E0; letter-spacing: -0.5px; }
    .label { font-size: 13px; line-height: 1.4; font-weight: 500; }
    .track { margin-top: auto; height: 10px; border-radius: 9999px; overflow: hidden; }
    .fill { height: 100%; border-radius: 9999px; background: #5B54E0; transform-origin: left;
            animation: grow 1.4s .6s ease-out both; }
    .meta { font-size: 11px; color: #5A6A7E; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
     .root { height: 392px; box-sizing: border-box; }</style>
      <div class="root"><div class="title">Highlights at One</div><div class="cards"><div class="card raised fade" style="animation-delay:0.0s"><div class="value">420+</div><div class="label">API integrations built or rebuilt</div><div class="track inset"><div class="fill" style="width:45%"></div></div><div class="meta">45% of One's 937</div></div><div class="card raised fade" style="animation-delay:0.1s"><div class="value">20,000+</div><div class="label">developers building on One</div></div><div class="card raised fade" style="animation-delay:0.2s"><div class="value">~100K</div><div class="label">API calls a day through the catalogue</div></div><div class="card raised fade" style="animation-delay:0.3s"><div class="value">30+</div><div class="label">OAuth connectors shipped</div></div><div class="card raised fade" style="animation-delay:0.4s"><div class="value">70%</div><div class="label">smaller AI-agent knowledge payloads</div></div><div class="card raised fade" style="animation-delay:0.5s"><div class="value">1,000+</div><div class="label">pull requests across 30+ repos</div></div></div></div>
    </div>
  </foreignObject>
</svg>
