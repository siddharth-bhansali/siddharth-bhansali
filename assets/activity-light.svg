<svg xmlns="http://www.w3.org/2000/svg" width="940" height="544" viewBox="0 0 940 544">
  <foreignObject x="0" y="0" width="940" height="532">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
    .root { box-sizing: border-box; width: 940px; background: #E4E9F0; border-radius: 24px;
            font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; color: #2D3748; padding: 30px; }
    .raised { background: #E4E9F0; box-shadow: 6px 6px 14px #B8C0CC, -6px -6px 14px #FFFFFF; }
    .raised-sm { background: #E4E9F0; box-shadow: 3px 3px 8px #B8C0CC, -3px -3px 8px #FFFFFF; }
    .inset { background: #E4E9F0; box-shadow: inset 3px 3px 8px #B8C0CC, inset -3px -3px 8px #FFFFFF; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700;
             margin: 0 0 22px 4px; }
    .title::before { content: ''; width: 6px; height: 20px; border-radius: 9999px; background: #5B54E0; }
    .fade { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { border-radius: 16px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 6px;
            height: 150px; box-sizing: border-box; }
    .value { font-size: 32px; font-weight: 800; color: #2D3748; letter-spacing: -0.5px; }
    .label { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .label i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .foot { flex: none; margin-top: auto; height: 26px; border-radius: 9999px; display: flex; align-items: center;
            padding: 0 12px; font-size: 11px; font-weight: 600; color: #5A6A7E; position: relative; overflow: hidden; }
    .foot .fill { position: absolute; inset: 0 auto 0 0; border-radius: 9999px; opacity: .28;
                  transform-origin: left; animation: grow 1.2s .5s ease-out both; }
    .foot span { position: relative; }
    .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 22px; }
    .panel { border-radius: 16px; padding: 20px 22px; box-sizing: border-box; }
    .ptitle { font-size: 13px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .ptitle i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 164px; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
    .track { width: 22px; height: 120px; border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
    .bar { width: 100%; border-radius: 4px 4px 0 0; transform-origin: bottom; animation: up .9s ease-out both; }
    .mon { font-size: 10px; font-weight: 600; color: #5A6A7E; }
    .val { position: absolute; top: -18px; font-size: 10px; font-weight: 600; white-space: nowrap; color: #5A6A7E; }
    .val.strong { font-size: 11px; font-weight: 800; color: #2D3748; }
    .note { font-size: 10px; color: #5A6A7E; margin-top: 8px; }
    @keyframes up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
     .root { height: 532px; box-sizing: border-box; }</style>
      <div class="root"><div class="title">Activity</div><div class="cards"><div class="card raised fade" style="animation-delay:0.0s"><div class="value">16,374</div><div class="label"><i style="background:#5B54E0"></i>contributions on GitHub</div><div class="foot inset">since 2017</div></div><div class="card raised fade" style="animation-delay:0.1s"><div class="value">4,365</div><div class="label"><i style="background:#5B54E0"></i>contributions this past year</div><div class="foot inset">last 12 months</div></div><div class="card raised fade" style="animation-delay:0.2s"><div class="value">68%</div><div class="label"><i style="background:#eb6834"></i>of days with a contribution</div><div class="foot inset"><div class="fill" style="width:68%;background:#eb6834"></div><span>251 of 369 days</span></div></div></div><div class="charts"><div class="panel raised fade" style="animation-delay:.3s"><div class="ptitle"><i style="background:#5B54E0"></i>Contributions per month</div><div class="chart"><div class="col"><div class="val">104</div><div class="track inset"><div class="bar" style="height:18px;background:#5B54E0;opacity:0.6;animation-delay:0.30s"></div></div><div class="mon">Nov</div></div><div class="col"><div class="val">9</div><div class="track inset"><div class="bar" style="height:2px;background:#5B54E0;opacity:0.6;animation-delay:0.35s"></div></div><div class="mon">Dec</div></div><div class="col"><div class="val">86</div><div class="track inset"><div class="bar" style="height:15px;background:#5B54E0;opacity:0.6;animation-delay:0.40s"></div></div><div class="mon">Jan</div></div><div class="col"><div class="val">235</div><div class="track inset"><div class="bar" style="height:41px;background:#5B54E0;opacity:0.6;animation-delay:0.45s"></div></div><div class="mon">Feb</div></div><div class="col"><div class="val">471</div><div class="track inset"><div class="bar" style="height:81px;background:#5B54E0;opacity:0.6;animation-delay:0.50s"></div></div><div class="mon">Mar</div></div><div class="col"><div class="val">316</div><div class="track inset"><div class="bar" style="height:55px;background:#5B54E0;opacity:0.6;animation-delay:0.55s"></div></div><div class="mon">Apr</div></div><div class="col"><div class="val">416</div><div class="track inset"><div class="bar" style="height:72px;background:#5B54E0;opacity:0.6;animation-delay:0.60s"></div></div><div class="mon">May</div></div><div class="col"><div class="val">574</div><div class="track inset"><div class="bar" style="height:99px;background:#5B54E0;opacity:0.6;animation-delay:0.65s"></div></div><div class="mon">Jun</div></div><div class="col"><div class="val">394</div><div class="track inset"><div class="bar" style="height:68px;background:#5B54E0;opacity:0.6;animation-delay:0.70s"></div></div><div class="mon">Jul</div></div><div class="col"><div class="val strong">695</div><div class="track inset"><div class="bar" style="height:120px;background:#5B54E0;opacity:1;animation-delay:0.75s"></div></div><div class="mon">Aug</div></div><div class="col"><div class="val">688</div><div class="track inset"><div class="bar" style="height:119px;background:#5B54E0;opacity:0.6;animation-delay:0.80s"></div></div><div class="mon">Sep</div></div><div class="col"><div class="val strong">270*</div><div class="track inset"><div class="bar" style="height:47px;background:#5B54E0;opacity:1;animation-delay:0.85s"></div></div><div class="mon">Oct</div></div></div><div class="note">* October so far</div></div><div class="panel raised fade" style="animation-delay:.4s"><div class="ptitle"><i style="background:#eb6834"></i>Weekly rhythm</div><div class="chart"><div class="col"><div class="val">790</div><div class="track inset"><div class="bar" style="height:94px;background:#eb6834;opacity:0.6;animation-delay:0.30s"></div></div><div class="mon">Mon</div></div><div class="col"><div class="val strong">1,009</div><div class="track inset"><div class="bar" style="height:120px;background:#eb6834;opacity:1;animation-delay:0.35s"></div></div><div class="mon">Tue</div></div><div class="col"><div class="val">881</div><div class="track inset"><div class="bar" style="height:105px;background:#eb6834;opacity:0.6;animation-delay:0.40s"></div></div><div class="mon">Wed</div></div><div class="col"><div class="val">827</div><div class="track inset"><div class="bar" style="height:98px;background:#eb6834;opacity:0.6;animation-delay:0.45s"></div></div><div class="mon">Thu</div></div><div class="col"><div class="val">560</div><div class="track inset"><div class="bar" style="height:67px;background:#eb6834;opacity:0.6;animation-delay:0.50s"></div></div><div class="mon">Fri</div></div><div class="col"><div class="val">104</div><div class="track inset"><div class="bar" style="height:12px;background:#eb6834;opacity:0.6;animation-delay:0.55s"></div></div><div class="mon">Sat</div></div><div class="col"><div class="val">194</div><div class="track inset"><div class="bar" style="height:23px;background:#eb6834;opacity:0.6;animation-delay:0.60s"></div></div><div class="mon">Sun</div></div></div><div class="note">Busiest on Tuesdays · weekends mostly off</div></div></div></div>
    </div>
  </foreignObject>
</svg>
