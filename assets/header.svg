<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .name { font: 700 56px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #f5f7ff; }
      .role { font: 400 20px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #9aa4c7; }
      .mono { font: 500 18px ui-monospace, Consolas, Menlo, monospace; fill: #ffb347; }
      .prompt { fill: #5b6b9a; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .node { animation: pulse 3s ease-in-out infinite; }
      .node:nth-of-type(2) { animation-delay: .6s; }
      .node:nth-of-type(3) { animation-delay: 1.2s; }
      .node:nth-of-type(4) { animation-delay: 1.8s; }
      .wire { stroke-dasharray: 4 8; animation: flow 1.6s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#dots)"/>
  <rect x="64" y="54" width="6" height="132" rx="3" fill="url(#accent)"/>

  <text x="96" y="104" class="name">Siddharth Bhansali</text>
  <text x="98" y="140" class="role">Software Engineer @ Ajackus  ·  India</text>
  <g transform="translate(98 178)">
    <text class="mono"><tspan class="prompt">~ $</tspan> <tspan>connecting AI agents to 900+ APIs</tspan></text>
    <rect class="cursor" x="372" y="-15" width="10" height="19" fill="#ffb347"/>
  </g>

  <!-- tiny network motif: one hub fanning out to APIs -->
  <g transform="translate(900 120)" fill="none" stroke="#3b4a7a" stroke-width="2">
    <path class="wire" d="M0 0 L120 -60"/>
    <path class="wire" d="M0 0 L150 -10"/>
    <path class="wire" d="M0 0 L140 45"/>
    <path class="wire" d="M0 0 L95 80"/>
    <path class="wire" d="M0 0 L-90 0"/>
  </g>
  <g transform="translate(900 120)">
    <circle r="22" fill="#1d2647" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="-90" cy="0" r="10" fill="#9aa4c7"/>
    <g>
      <circle class="node" cx="120" cy="-60" r="8" fill="#ff7a45"/>
      <circle class="node" cx="150" cy="-10" r="8" fill="#ffb347"/>
      <circle class="node" cx="140" cy="45" r="8" fill="#ff7a45"/>
      <circle class="node" cx="95" cy="80" r="8" fill="#ffb347"/>
    </g>
  </g>
</svg>
